<svg viewBox="0 0 100 110" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradien Heksagon Luar -->
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Gradien Shading 3D -->
    <linearGradient id="innerShade" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <!-- Frame Heksagon Luar -->
  <path d="M50 4 L92 27 L92 73 L50 96 L8 73 L8 27 Z" fill="url(#hexGrad)" stroke="#6366f1" stroke-width="2" stroke-linejoin="round" />

  <!-- Dinding Dalam / Efek Dimensi -->
  <path d="M50 14 L82 32 L82 68 L50 86 L18 68 L18 32 Z" fill="#1e1b4b" opacity="0.85" />

  <!-- Garis Git Branch & Node -->
  <path d="M32 68 V45 C32 38 42 34 52 34 H68" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" />
  <path d="M52 34 V52" stroke="#60a5fa" stroke-width="3.5" stroke-linecap="round" />

  <!-- Panah Branch -->
  <path d="M64 28 L72 34 L64 40" stroke="#60a5fa" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Node Lingkaran Git -->
  <circle cx="32" cy="58" r="4" fill="#ffffff" stroke="#3b82f6" stroke-width="2" />
  <circle cx="52" cy="52" r="3.5" fill="#ffffff" stroke="#3b82f6" stroke-width="2" />

  <!-- Grafik Analytics Naik -->
  <path d="M28 66 L42 56 L52 62 L66 44" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M60 44 H66 V50" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Indikator Real-time Pulse -->
  <circle cx="68" cy="68" r="10" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" opacity="0.8" />
  <circle cx="68" cy="68" r="5" fill="#38bdf8" />
</svg>
